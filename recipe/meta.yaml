{% set name = "python-manilaclient" %}
{% set version = "5.7.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/18/de/2749f6509268abe3798d7c1248db9cfef3a40ae0a525b619c7b62c130aa6/python_manilaclient-{{ version }}.tar.gz
  sha256: 05d154567bd25fbca2b474a53ff1b30f68f3bc5f2f87d078415550aea6305bd4

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - manila = manilaclient.shell:main

requirements:
  host:
    - pip
    - python {{ python_min }}
    - pbr >=2.0.0
    - setuptools
  run:
    - python >={{ python_min }}
    - pbr !=2.1.0,>=2.0.0
    - oslo.config >=5.2.0
    - oslo.log >=3.36.0
    - oslo.serialization !=2.19.1,>=2.18.0
    - oslo.utils >=3.33.0
    - prettytable >=0.7.1
    - requests >=2.14.2
    - simplejson >=3.5.1
    - babel !=2.4.0,>=2.3.4
    - osc-lib >=1.10.0
    - python-keystoneclient >=3.8.0
    - debtcollector >=1.2.0

test:
  requires:
    - python {{ python_min }}
  imports:
    - manilaclient
  commands:
    - manila -h

about:
  home: https://docs.openstack.org/python-manilaclient/latest/
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Client library for OpenStack Manila API.
  doc_url: https://docs.openstack.org/python-manilaclient/latest/
  dev_url: https://opendev.org/openstack/python-manilaclient

extra:
  recipe-maintainers:
    - tschoonj
